# ─── greencross-sales — tests on every push and PR ───────────────────────────────────────
#
# Runs THE SAME gx-preflight.sh the pre-push hook runs. Not a reimplementation: a second copy of the
# gate drifts from the real one and starts disagreeing with local results, which is how people learn
# to distrust CI.
#
# WHY CI AND NOT JUST THE HOOK. A hook protects pushes from one machine and `git push --no-verify`
# walks past it leaving no trace. On 2026-08-22 the hub's gate turned out to carry a portability bug
# its author's Mac could not express — macOS /bin/sh is bash in POSIX mode, Ubuntu's is dash. CI
# surfaced it on the first foreign run.
#
# `sh` is correct here: gx-preflight.sh is #!/bin/sh and uses no bashisms. Verified by running it
# under dash before writing this file, not assumed.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # `secrets` is NOT available in an `if:` condition — a step guarded by `if: secrets.X != ''`
    # never runs, silently. Map it to env at job level and test that.
    env:
      GX_SIBLING_TOKEN: ${{ secrets.GX_SIBLING_TOKEN }}
    steps:
      - name: Check out greencross-sales
        uses: actions/checkout@v7
        with:
          path: greencross-sales

      # THE THREE SKIPS IN THIS JOB ARE CORRECT. DO NOT INVENT A PAT TO CLOSE THEM.
      #
      # Exactly ONE sibling repo is read by any suite here — greencross-command-center — and three
      # suites read it: cross_app_contract_test.js, revenue_rules_contract_test.js and
      # store_palette_drift_test.js. They are wrappers; the canonical tests live in the hub because
      # each spans repos and neither side owns it. The hub is PRIVATE, so this spoke's default
      # GITHUB_TOKEN cannot reach it and they SKIP on every run here.
      #
      # That is reduced CI coverage in this repo, not an unguarded contract, and it is covered twice
      # over: the local pre-push hook runs them against the real sibling checkout on this desk, and
      # greencross-command-center's own CI runs all three canonical suites with ALL SEVEN spokes
      # checked out (they are public, so the hub needs no secret either).
      #
      # MEASURED 2026-09-13, because the obvious "fix" is to add public siblings and it buys nothing:
      # checking out greencross-gx-theme or greencross-leaderboard here unlocks NO suite. No test in
      # this repo opens either one — maintenance_wiring_test.js reads only this repo's index.html and
      # matches the gx-theme URL as text, and it passes in CI today (14/14, run 34791786723).
      # greencross-leaderboard is read only by the hub's canonical files, which need the hub anyway.
      #
      # The GX_SIBLING_TOKEN steps below are the ONLY thing that would change what runs here. They
      # are optional and currently dormant (the secret is unset). If it is ever set, all three
      # siblings must arrive together — the hub alone is not enough for the palette-drift tool or the
      # revenue-rules contract, which read inventory and leaderboard through it.
      - name: Check out greencross-command-center
        if: env.GX_SIBLING_TOKEN != ''
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: greencrosscanna/greencross-command-center
          path: greencross-command-center
          token: ${{ secrets.GX_SIBLING_TOKEN }}

      - name: Check out greencross-inventory
        if: env.GX_SIBLING_TOKEN != ''
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: greencrosscanna/greencross-inventory
          path: greencross-inventory
          token: ${{ secrets.GX_SIBLING_TOKEN }}

      - name: Check out greencross-leaderboard
        if: env.GX_SIBLING_TOKEN != ''
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: greencrosscanna/greencross-leaderboard
          path: greencross-leaderboard
          token: ${{ secrets.GX_SIBLING_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run the gate
        working-directory: greencross-sales
        run: sh ./gx-preflight.sh

      # Say what was NOT covered. A green check that quietly skipped a cross-repo suite is exactly the
      # failure this suite spent a week removing.
      - name: Report coverage honestly
        if: always()
        working-directory: greencross-sales
        run: |
          {
            echo "### Coverage"
            echo ""
            for t in tests/*_test.js; do
              out="$(node "$t" 2>&1 || true)"
              # ONE MARKER, EVERY REPO: a skip is a line whose first non-space word is SKIP.
              # Column 0 means the whole suite could not run; indented means it ran but had to pass
              # over part of itself — so the COUNT matters, not just the fact.
              #
              # This used to be five different greps across eight repos, each matching the PHRASING
              # its own tests happened to use ("not a sibling", "checkout not present", "live-value
              # check skipped") — five guesses at wording that nothing kept in step, and a suite that
              # reworded its skip would silently go back to being reported as having run. Two suites
              # (crew's drift check, spiff's live-value check) were already in that state and were
              # given the marker in the same pass.
              #
              # Case-sensitive on purpose: assertion labels are lowercase prose ("a nameless row is
              # skipped") and a -i match would flag those until nobody read the warning.
              SKIPRE='^SKIP|^ +SKIP '
              n="$(printf '%s' "$out" | grep -cE "$SKIPRE" || true)"
              if [ "${n:-0}" -gt 0 ]; then
                echo "- ⚠️ \`$t\` — **$n SKIPPED**: $(printf '%s' "$out" | grep -E "$SKIPRE" | head -1 | sed 's/^ *//')"
              else
                echo "- ✅ \`$t\` — $(printf '%s' "$out" | tail -1)"
              fi
            done
            echo ""
            if [ -d ../greencross-command-center ]; then
              echo "Sibling repos present — cross-repo suites ran."
            else
              # NAME ALL THREE. This line listed two of them for as long as it existed, so a reader
              # comparing it against the three ⚠️ rows above had to work out which list was wrong —
              # and a partial list read as complete is how the missing one gets "discovered" again.
              echo "> **The hub is absent, so 3 wrapper suites did not run here:**"
              echo "> cross_app_contract_test.js, revenue_rules_contract_test.js, store_palette_drift_test.js."
              echo "> This is EXPECTED and needs no fix. greencross-command-center is private, so this"
              echo "> repo's default GITHUB_TOKEN cannot reach it — and all three canonical suites run"
              echo "> in the hub's own CI with every spoke checked out, plus locally here on every push"
              echo "> through the pre-push hook. Reduced CI coverage in this repo, not an unguarded"
              echo "> contract. **Do not add a PAT to close this.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
